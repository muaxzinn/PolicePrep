<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#1a56db"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle Border Glow -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="4"/>

  <!-- Shield Shape with Shadow -->
  <g filter="url(#shadow)">
    <!-- Outer Shield -->
    <path d="M256 70 L390 120 C390 270, 340 370, 256 430 C172 370, 122 270, 122 120 Z" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-width="12" stroke-linejoin="round"/>
    
    <!-- Inner Shield Accent -->
    <path d="M256 100 L360 140 C360 255, 320 340, 256 395 C192 340, 152 255, 152 140 Z" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linejoin="round"/>

    <!-- Central Police Star -->
    <path d="M256 150 L273 203 L329 203 L284 236 L301 289 L256 256 L211 289 L228 236 L183 203 L239 203 Z" fill="url(#goldGrad)"/>

    <!-- Checkmark inside Shield -->
    <path d="M220 295 L245 320 L295 270" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Monogram text: POLICE PREP -->
  <text x="256" y="475" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans Thai', 'Inter', sans-serif" font-size="28" font-weight="700" fill="#93c5fd" letter-spacing="4">POLICEPREP</text>
</svg>
